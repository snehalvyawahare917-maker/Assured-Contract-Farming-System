
<!DOCTYPE html>
<html>
<head>
    <title>Edit Farmer Profile | Assured Farming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f8f1;
            color: #26352a;
        }

        .navbar {
            background: #1b5e20;
            color: white;
            padding: 17px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            text-align: center;
            padding: 35px 15px;
            background: linear-gradient(120deg, #e8f5e9, #f5fbf3);
        }

        .hero h1 {
            color: #1b5e20;
            font-size: 29px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #637267;
            line-height: 1.6;
        }

        .form-card {
            width: 90%;
            max-width: 550px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 37px;
        }

        .form-card h2 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .form-subtitle {
            text-align: center;
            color: #718074;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344b37;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd8cb;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: #fcfefc;
        }

        input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.12);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn {
            background: #2e7d32;
            color: white;
        }

        .update-btn:hover {
            background: #1b5e20;
        }

        .back-btn {
            background: #eceff1;
            color: #37474f;
        }

        .back-btn:hover {
            background: #dce3e6;
        }

        footer {
            background: #17451e;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 15px 5%;
            }

            .logo {
                font-size: 18px;
            }

            .form-card {
                padding: 23px 18px;
            }

            .hero h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">🌱 Assured Farming</div>
        <a href="/">🏠 Home</a>
    </div>

    <!-- Page Header -->
    <section class="hero">
        <h1>✏️ Edit Farmer Profile</h1>
        <p>Update your personal and farming information.</p>
    </section>

    <!-- Edit Profile Form -->
    <div class="form-card">

        <div class="form-icon">👨‍🌾</div>

        <h2>Update Your Details</h2>
        <p class="form-subtitle">
            Please check your information before saving.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">👤 Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ farmer.name }}"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="mobile">📱 Mobile Number</label>
                <input
                    type="text"
                    id="mobile"
                    name="mobile"
                    value="{{ farmer.mobile }}"
                    placeholder="Enter your mobile number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="village">📍 Village</label>
                <input
                    type="text"
                    id="village"
                    name="village"
                    value="{{ farmer.village }}"
                    placeholder="Enter your village"
                    required
                >
            </div>

            <div class="form-group">
                <label for="crop">🌱 Crop</label>
                <input
                    type="text"
                    id="crop"
                    name="crop"
                    value="{{ farmer.crop }}"
                    placeholder="Enter your crop"
                    required
                >
            </div>

            <div class="buttons">
                <button class="btn update-btn" type="submit">
                    💾 Update Profile
                </button>

                <a class="btn back-btn" href="/farmer/profile/">
                    ⬅ Back to Profile
                </a>
            </div>
        </form>

    </div>

    <!-- Footer -->
    <footer>
        🌱 Assured Contract Farming System | Growing Together
    </footer>

</body>
</html>
