
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f0f7f1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            color: #176b36;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            color: #244b31;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbdacb;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #218838;
            box-shadow: 0 0 5px rgba(33, 136, 56, 0.2);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #176b36;
        }

        .error {
            color: #b00020;
            background: #fff0f0;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #218838;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="header">
            <div class="icon">🔐</div>
            <h1>Admin Login</h1>
            <p>Sign in to manage the farming system</p>
        </div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter admin username" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <br>
            <a href="/">← Back to Home</a>
        </div>
    </div>
</body>
</html>
