
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Profile | Contract Farming</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f7f1;
            color: #26352a;
        }

        .navbar {
            background: #176b3a;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .profile-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #e0f2e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
        }

        h1 {
            text-align: center;
            color: #176b3a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718078;
            margin-bottom: 30px;
        }

        .info {
            background: #f5faf6;
            border: 1px solid #e0eee3;
            border-radius: 9px;
            padding: 15px 18px;
            margin-bottom: 14px;
        }

        .info label {
            display: block;
            color: #64806b;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .info p {
            color: #26352a;
            font-size: 16px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 13px 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .edit-btn {
            background: #176b3a;
            color: white;
        }

        .dashboard-btn {
            background: #e5f1e8;
            color: #176b3a;
            border: 1px solid #c7dfcd;
        }

        .btn:hover {
            opacity: 0.88;
        }

        footer {
            text-align: center;
            color: #718078;
            padding: 20px;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .profile-card {
                padding: 25px 18px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🌱 Contract Farming</h2>
        <a href="/">Home</a>
    </div>

    <div class="container">
        <div class="profile-card">

            <div class="profile-icon">🛒</div>

            <h1>Buyer Profile</h1>
            <p class="subtitle">Your account information</p>

            <div class="info">
                <label>Full Name</label>
                <p>{{ buyer.name }}</p>
            </div>

            <div class="info">
                <label>Mobile Number</label>
                <p>{{ buyer.mobile }}</p>
            </div>

            <div class="info">
                <label>Company Name</label>
                <p>{{ buyer.company }}</p>
            </div>

            <div class="info">
                <label>Location</label>
                <p>{{ buyer.location }}</p>
            </div>

            <div class="buttons">
                <a href="{% url 'buyer_edit_profile' %}" class="btn edit-btn">
                    ✏️ Edit Profile
                </a>

                <a href="/buyer/dashboard/" class="btn dashboard-btn">
                    ← Back to Dashboard
                </a>
            </div>

        </div>
    </div>

    <footer>
        © 2026 Contract Farming System | All Rights Reserved
    </footer>

</body>
</html>
