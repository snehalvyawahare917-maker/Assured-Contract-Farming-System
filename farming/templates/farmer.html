
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Section | Contract Farming</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f7f1;
            color: #26352a;
        }

        .navbar {
            background: #176b3a;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .hero {
            background: white;
            border-radius: 16px;
            padding: 55px 25px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            border-top: 5px solid #299650;
        }

        .hero-icon {
            font-size: 65px;
            margin-bottom: 15px;
        }

        .hero h1 {
            color: #176b3a;
            font-size: 32px;
            margin-bottom: 14px;
        }

        .hero p {
            color: #718078;
            font-size: 16px;
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto 28px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            min-width: 190px;
            padding: 14px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .register-btn {
            background: #176b3a;
            color: white;
        }

        .register-btn:hover {
            background: #10532c;
            transform: translateY(-3px);
        }

        .login-btn {
            background: #e5f1e8;
            color: #176b3a;
            border: 1px solid #b9d9c1;
        }

        .login-btn:hover {
            background: #d1e8d8;
            transform: translateY(-3px);
        }

        .info-section {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .info-card {
            background: white;
            text-align: center;
            padding: 25px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .info-card .icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .info-card h3 {
            color: #176b3a;
            font-size: 17px;
            margin-bottom: 9px;
        }

        .info-card p {
            color: #718078;
            font-size: 14px;
            line-height: 1.6;
        }

        .back-link {
            text-align: center;
            margin-top: 28px;
        }

        .back-link a {
            color: #176b3a;
            font-weight: bold;
            text-decoration: none;
        }

        footer {
            text-align: center;
            color: #718078;
            padding: 25px 15px;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 650px) {
            .navbar {
                padding: 16px 5%;
            }

            .container {
                margin: 30px auto;
            }

            .hero {
                padding: 38px 18px;
            }

            .hero h1 {
                font-size: 26px;
            }

            .info-section {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>🌱 Contract Farming</h2>
        <a href="/">🏠 Home</a>
    </div>

    <div class="container">

        <div class="hero">
            <div class="hero-icon">👨‍🌾</div>

            <h1>Welcome to Farmer Section</h1>

            <p>
                Join our Contract Farming System to connect with buyers,
                manage your farming contracts and access your crop details
                in one place.
            </p>

            <div class="button-group">
                <a href="/farmer/register/" class="btn register-btn">
                    🌾 Farmer Registration
                </a>

                <a href="/farmer/login/" class="btn login-btn">
                    🔐 Farmer Login
                </a>
            </div>
        </div>
